<!DOCTYPE html>
<meta charset="utf-8" />
<title>QA UI harness</title>
<body>
<div id="out">running…</div>
<iframe id="f" style="width:1680px;height:900px;border:0"></iframe>
<script>
/* QA 前端交互回归台：同源 iframe 驱动真实界面，不用 mock Vue 状态。
 * kind=bilingual 双向联动 / kind=anchor 锚点跳转 / kind=graph 图谱渲染
 */
const params = new URLSearchParams(location.search);
const kind = params.get("kind") || "bilingual";
const f = document.getElementById("f");
f.src = kind === "bilingual" ? "/#bi" : "/";

const out = document.getElementById("out");
const log = [];
const say = (s) => { log.push(s); out.textContent = log.join("\n"); };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

async function ready(predicate, tries = 150, gap = 400) {
  for (let i = 0; i < tries; i++) {
    try {
      const w = f.contentWindow;
      if (w && w.document && predicate(w.document)) return w.document;
    } catch (e) { /* 导航瞬间忽略 */ }
    await wait(gap);
  }
  return null;
}

async function pickDoc(minChunks) {
  // 默认打开的文档会随"最新入库"变化（比如刚传了一篇 1 页的中文样本），
  // 双语用例需要足够多的段落，所以自己挑一篇够长的，不依赖默认值
  for (let i = 0; i < 60; i++) {
    const w = f.contentWindow;
    const vm = w && w.__sciagent;
    if (vm && vm.docs && vm.docs.length) {
      const hit = vm.docs.find((x) => (x.chunks || 0) >= minChunks) || vm.docs[0];
      if (vm.activeDocId !== hit.id) await vm.openDoc(hit);
      return hit;
    }
    await wait(300);
  }
  return null;
}

async function testBilingual() {
  const doc = await pickDoc(60);
  if (doc) {
    say("选用文献 " + doc.filename + "（" + (doc.chunks || 0) + " 块）");
    // 对照视图是**按页懒翻译**：新入库的文献一页都没译过，右栏就是空的，
    // 这时测"双向同步滚动"必然失败（本轮补的 12 篇新文献就是这样把 B06 弄红的）。
    // 先确保前两页有译文——接口是同步的，已译过则走缓存秒回。
    try {
      await fetch(`/api/documents/${doc.id}/bilingual/translate`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        // 译 6 页而不是 2 页：2 页只有 4 段，两侧内容高度都不足 700px，
        // 滚动断言拿到的 scrollTop 恒为 0，会把"同步正常"误判成失败。
        body: JSON.stringify({ page_from: 1, page_to: 6 }),
      });
      await f.contentWindow.__sciagent.openDoc(doc);
      await wait(600);
    } catch (e) { say("预翻译失败（后面会如实报错）：" + e); }
  }
  const d = await ready((x) => x.querySelectorAll(".bi-pane").length === 2 &&
                              x.querySelectorAll(".bi-seg").length > 3);
  if (!d) return say("RESULT: FAIL 双栏未渲染");
  const [en, zh] = d.querySelectorAll(".bi-pane");
  const segs = en.querySelectorAll(".bi-seg").length;
  // 滚动距离必须按**可滚动高度**算，不能写死 700/1300：
  // 中文译文长度约为英文的 0.6 倍，同一批段落中文栏可能根本没有 700px 可滚，
  // 设 scrollTop=700 会被浏览器夹回 0，看起来像"中文栏没跟随"。
  // 本轮补的新文献就是这样把这条用例弄红的（英文滚 700、中文停在 0）。
  // 对照视图是**按页预取**的（/bilingual 默认只返回当前页），所以初始只有一页内容，
  // 高度往往不足一屏。真实用户会继续往下滚，前端触底再拉下一页——这里照样模拟：
  // 反复滚到底，直到内容足够长或拉够 4 轮。不这么做，"可滚动高度=0"
  // 会被误读成"双栏没联动"，实际只是还没加载第二页。
  const enH = () => en.scrollHeight - en.clientHeight;
  const zhH = () => zh.scrollHeight - zh.clientHeight;
  for (let i = 0; i < 4 && (enH() < 200 || zhH() < 120); i++) {
    en.scrollTop = en.scrollHeight; en.dispatchEvent(new Event("scroll"));
    await wait(1100);
  }
  const enMax = enH(), zhMax = zhH();
  say("双栏渲染 OK，已加载段落=" + en.querySelectorAll(".bi-seg").length
      + "，可滚动高度 英文=" + enMax + " 中文=" + zhMax);
  if (enMax < 120 || zhMax < 120) return say("RESULT: FAIL 内容不足以测滚动（预取未生效）");

  en.scrollTop = Math.round(enMax * 0.6); en.dispatchEvent(new Event("scroll"));
  await wait(400);
  const zh1 = Math.round(zh.scrollTop);
  say("英文滚到 60% -> 中文 " + zh1);

  const en0 = Math.round(en.scrollTop);
  zh.scrollTop = Math.round(zhMax * 0.85); zh.dispatchEvent(new Event("scroll"));
  await wait(400);
  const en1 = Math.round(en.scrollTop);
  say("中文滚到 85% -> 英文 " + en0 + " => " + en1);

  const top = (pane) => {
    const s = [...pane.querySelectorAll(".bi-seg")]
      .find((e) => e.offsetTop + e.offsetHeight > pane.scrollTop + 4);
    return s ? Number(s.dataset.i) : -1;
  };
  const ie = top(en), iz = top(zh);
  say("顶部段落序号 英文=" + ie + " 中文=" + iz);

  const pass = zh1 > 0 && en1 !== en0 && Math.abs(ie - iz) <= 1;
  say(pass ? "RESULT: PASS 双向联动生效且按段落对齐" : "RESULT: FAIL 联动异常");
}

async function testAnchor() {
  const d = await ready((x) => x.querySelector(".chat-list") && x.querySelector(".page-stage"));
  if (!d) return say("RESULT: FAIL 主界面未渲染");
  const w = f.contentWindow;
  // Vue 在 document 上做了 .anchor 事件委托，动态插入一个合法锚点即可触发真实 jump()
  const a = d.createElement("span");
  a.className = "anchor";
  a.dataset.page = "3";
  a.dataset.bbox = "100,100,300,160";
  a.textContent = "QA-ANCHOR";
  d.querySelector(".chat-list").appendChild(a);
  a.dispatchEvent(new w.MouseEvent("click", { bubbles: true }));
  await wait(1200);
  const img = d.querySelector(".page-stage img.pdf-page");
  const hl = d.querySelectorAll(".page-stage .hl");
  const pager = d.querySelector(".pager");
  say("img.src=" + (img ? img.getAttribute("src") : "none"));
  say("高亮框数量=" + hl.length + " 页码显示=" + (pager ? pager.textContent.trim() : "none"));
  const okImg = img && /\/page\/3\.png/.test(img.getAttribute("src") || "");
  const okHl = hl.length >= 1;
  say(okImg && okHl ? "RESULT: PASS 锚点一键跳到 p3 且绘制 bbox 高亮"
                    : "RESULT: FAIL 跳转或高亮缺失");
}

async function testGraph() {
  const d = await ready((x) => x.querySelector(".viewer-tools") && x.querySelector(".chat-list"));
  if (!d) return say("RESULT: FAIL 主界面未渲染");
  const radios = [...d.querySelectorAll(".viewer-tools .el-radio-button")];
  const graphBtn = radios.find((r) => (r.textContent || "").includes("图谱"));
  if (!graphBtn) return say("RESULT: FAIL 未找到图谱切换按钮");
  graphBtn.click();
  const t0 = performance.now();
  const g = await ready((x) => x.querySelector(".graph-canvas canvas"), 80, 250);
  const firstFrameMs = Math.round(performance.now() - t0);
  if (!g) return say("RESULT: FAIL 图谱 canvas 未渲染");
  const canvas = g.querySelector(".graph-canvas canvas");
  let nodes = -1;
  try {
    const r = await fetch("/api/graph");
    const j = await r.json();
    nodes = (j.nodes || []).length;
  } catch (e) {}
  say("图谱节点=" + nodes + " 首帧耗时=" + firstFrameMs + "ms canvas=" +
      canvas.width + "x" + canvas.height);
  // 采样帧间隔；无头 + virtual-time 下仅作参考，不冒充真实设备帧率
  let frames = 0;
  const t1 = performance.now();
  const tick = () => { frames++; if (performance.now() - t1 < 1000) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
  await wait(1200);
  say("1s 内 rAF 回调=" + frames + "（无头虚拟时钟，仅参考）");
  const pass = nodes >= 20 && firstFrameMs < 3000 && canvas.width > 100;
  say(pass ? "RESULT: PASS 20+ 节点图谱渲染，首帧 " + firstFrameMs + "ms"
           : "RESULT: FAIL 图谱节点/首帧不达标");
}

async function testStream() {
  const d = await ready((x) => x.querySelector(".ask-bar input") && x.querySelector(".chat-list"));
  if (!d) return say("RESULT: FAIL 主界面未渲染");
  const w = f.contentWindow;
  const vm = w.__sciagent;
  if (!vm) return say("RESULT: FAIL 未暴露 Vue 实例，无法驱动真实方法");

  // 先验证控件真的渲染出来（自闭合组件 bug 曾把发送按钮整个吞掉）
  const sw = d.querySelector(".chat-tools .el-switch");
  const btn = d.querySelector(".ask-bar .el-button");
  if (!sw || !btn) return say("RESULT: FAIL 流式开关或发送按钮未渲染");
  if (!sw.classList.contains("is-checked")) sw.click();
  say("控件已渲染：" + (btn.textContent || "").trim() + " / 流式开关；开始真实 SSE…");

  // 直接调用前端 askStream：仍走真实 fetch+SSE、真实思考时间线与逐 token 渲染，
  // 只是绕开"虚拟时钟 vs DOM 事件"的赛跑（headless 下点击后的等待不可靠）。
  await vm.askStream("一句话说明 Transformer 的核心机制");
  const msgs = vm.messages.filter((m) => m.role === "assistant");
  const m = msgs[msgs.length - 1] || {};
  const steps = (m.thinking || []).length;
  const html = m.html || "";
  const text = (d.querySelector(".msg.assistant .md") || {}).textContent || "";
  const evidence = (m.evidence || []).length;
  say("思考步骤=" + steps + " html字符=" + html.length +
      " DOM文本=" + text.length + " 证据=" + evidence);
  say("答案片段=" + text.slice(0, 80).replace(/\n/g, " "));
  const pass = steps >= 2 && text.length > 20 && evidence > 0;
  say(pass ? "RESULT: PASS 流式开关/思考时间线/逐token答案/证据均渲染"
           : "RESULT: FAIL 流式渲染不完整");
}

(async () => {
  try {
    if (kind === "bilingual") await testBilingual();
    else if (kind === "anchor") await testAnchor();
    else if (kind === "graph") await testGraph();
    else if (kind === "stream") await testStream();
    else say("RESULT: FAIL 未知 kind");
  } catch (e) { say("RESULT: ERROR " + e); }
})();
</script>
