<!DOCTYPE html>
<meta charset="utf-8" />
<title>sync-selftest</title>
<body>
<div id="out">running…</div>
<iframe id="f" src="/#bi" style="width:1680px;height:900px;border:0"></iframe>
<script>
// 目的：验证官方 1.3.3.3 要求的"双向联动"是否真的生效。
// 手法：同源 iframe 打开主界面，程序化滚动一侧，回读另一侧 scrollTop 与顶部段落序号。
const out = document.getElementById("out");
const log = [];
let done = false;
const say = (s) => {
  log.push(s);
  out.textContent = log.join("\n");
  if (/^RESULT/.test(s)) done = true;
};
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

const segsOf = (w) => [...w.document.querySelectorAll(".bi-pane")];
const topIdx = (pane) => {
  const segs = [...pane.querySelectorAll(".bi-seg")];
  const hit = segs.find((s) => s.offsetTop + s.offsetHeight > pane.scrollTop + 4);
  return hit ? Number(hit.dataset.i) : -1;
};

async function run() {
  const f = document.getElementById("f");
  let panes = [];
  for (let i = 0; i < 150; i++) {
    try {
      const w = f.contentWindow;
      // contentDocument 在导航完成后会被替换，必须每次重新取
      if (w && w.document) panes = segsOf(w);
      if (panes.length === 2 && w.document.querySelectorAll(".bi-seg").length > 4) break;
    } catch (e) { /* 跨文档导航瞬间可能抛错，忽略 */ }
    await wait(400);
  }
  if (panes.length !== 2) {
    say("FAIL 未渲染双栏：panes=" + panes.length);
    return;
  }
  const [en, zh] = panes;
  say("OK 双栏已渲染，段落数=" + en.querySelectorAll(".bi-seg").length);

  // 1) 拖动英文 → 中文跟随
  en.scrollTop = 700;
  en.dispatchEvent(new Event("scroll"));
  await wait(400);
  const zh1 = Math.round(zh.scrollTop);
  say("英文滚到 700 → 中文 " + zh1 + (zh1 > 0 ? " [跟随]" : " [未跟随]"));

  // 2) 拖动中文 → 英文跟随
  const en0 = Math.round(en.scrollTop);
  zh.scrollTop = 1300;
  zh.dispatchEvent(new Event("scroll"));
  await wait(400);
  const en1 = Math.round(en.scrollTop);
  say("中文滚到 1300 → 英文 " + en0 + " → " + en1 + (en1 !== en0 ? " [跟随]" : " [未跟随]"));

  // 3) 对齐质量：两侧视口顶部应是同一段（允许 1 段误差，因段高不同）
  const ie = topIdx(en), iz = topIdx(zh);
  say("顶部段落序号：英文 " + ie + " / 中文 " + iz + "（差 " + Math.abs(ie - iz) + "）");

  const pass = zh1 > 0 && en1 !== en0 && Math.abs(ie - iz) <= 1;
  say(pass ? "RESULT: PASS 双向联动生效且按段落对齐" : "RESULT: FAIL 联动异常");
}
run().catch((e) => say("RESULT: ERROR " + e));
</script>
