name: keepalive

# 云端演示实例的保活：每 5 分钟打一次 /api/warm。
#
# 为什么需要：WorkBuddy 托管沙箱空闲会休眠，唤醒后第一个请求要现读 2 万个块的
# 检索索引（实测冷 27.9 s / 热 1.2 s）。评委半夜点开链接时，没人愿意等半分钟。
#
# 为什么打 /api/warm 而不是 /api/chat：
#   /api/chat 是真问答，每次都要检索 + 生成，烧 token；
#   /api/warm 只让模型回一个字，一次调用约 700 ms，一天 288 次成本可以忽略。
#
# 为什么用 GitHub Actions 而不是别家定时服务：
#   公开仓库的 Actions 免费、无需注册第三方账号、配置就在仓库里（评审看得见）。
#   代价是 GitHub 的 schedule 是"尽力而为"，高峰期会延迟几分钟——对保活够用了。
#
# 地址放在仓库 Secret 里（WARM_URL），不写进 yml：sharecode 是这个演示实例的
# 唯一访问凭据，写在公开文件里等于把链接公开。

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: 打一次 /api/warm
        env:
          WARM_URL: ${{ secrets.WARM_URL }}
        run: |
          if [ -z "$WARM_URL" ]; then
            echo "::warning::未配置 WARM_URL secret，本次跳过（参见 README「在线演示」）"
            exit 0
          fi
          start=$(date +%s)
          code=$(curl -sS -o /tmp/warm.json -w '%{http_code}' --max-time 150 "$WARM_URL" || echo 000)
          cost=$(( $(date +%s) - start ))
          echo "HTTP $code，耗时 ${cost}s"
          head -c 400 /tmp/warm.json 2>/dev/null || true
          echo
          # 冷启动（>15s）单独标出来：能直观看出保活有没有起作用
          if [ "$cost" -gt 15 ]; then
            echo "::warning::本次是冷启动（${cost}s），说明中间睡过一次——保活间隔可能太长"
          fi
          if [ "$code" != "200" ]; then
            echo "::error::预热失败，HTTP $code"
            exit 1
          fi
